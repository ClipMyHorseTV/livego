name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test (Go ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: matrix.name == 'stable'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          # shields.io endpoint badge, published to the badges branch by the coverage-badge job.
          awk -v total="$total" 'BEGIN {
            pct = total + 0
            color = pct >= 80 ? "brightgreen" : pct >= 60 ? "yellow" : pct >= 40 ? "orange" : "red"
            printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%s\",\"color\":\"%s\"}\n", total, color
          }' > coverage.json
          {
            echo '### Coverage'
            echo
            echo "Total: **$total**"
            echo
            echo '<details><summary>Per package</summary>'
            echo
            echo '| Package | Coverage |'
            echo '| --- | ---: |'
            # coverage.out lines are "file:start,end statements count"; sum statements per package directory.
            awk -v mod="$(go list -m)/" 'NR > 1 {
              split($1, loc, ":"); file = loc[1]; sub("^" mod, "", file)
              pkg = file; sub("/[^/]*$", "", pkg); if (pkg == file) pkg = "."
              total[pkg] += $2; if ($3 > 0) covered[pkg] += $2
            } END {
              for (pkg in total) printf "| `%s` | %.1f%% |\n", pkg, total[pkg] ? 100 * covered[pkg] / total[pkg] : 0
            }' coverage.out | sort
            echo
            echo '</details>'
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on PR
        # The token is read-only for pull requests from forks, so commenting would fail there.
        if: >-
          matrix.name == 'stable' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md
      - name: Upload coverage badge
        if: matrix.name == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.json
      - name: Annotate coverage
        if: matrix.name == 'stable' && github.event_name == 'pull_request'
        uses: ggilder/codecoverage@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_FILE_PATH: coverage.out
          COVERAGE_FORMAT: go

  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage badge
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - name: Publish to badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only ever writes the badges branch, never main. Force-pushes a single
        # commit so the branch never accumulates history.
        run: |
          dir=$(mktemp -d)
          mv coverage.json "$dir/"
          cd "$dir"
          git init -q -b badges
          git add coverage.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update coverage badge"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/badges
